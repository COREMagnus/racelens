name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Unit tests (mocked OpenAI)
        run: npm test

      - name: Export Expo web
        run: npm run export:web
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
